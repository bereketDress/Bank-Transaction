<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Register | BankOfCLI</title><link rel="stylesheet" th:href="@{/style.css}"></head>
<body><main class="auth"><h1>Create your profile</h1>
<p class="error" role="alert" th:if="${error}" th:text="${error}"></p>
<form th:action="@{/register}" method="post">
<label>Name<input name="name" autocomplete="name" required></label>
<label>Email<input type="email" name="email" autocomplete="email" required></label>
<label>Password (at least 8 characters)<input type="password" name="password" autocomplete="new-password" minlength="8" required></label>
<button type="submit">Register</button></form><p><a th:href="@{/login}">Back to sign in</a></p>
</main></body></html>
